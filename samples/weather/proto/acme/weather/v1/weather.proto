syntax = "proto3";

package acme.weather.v1;

import "acme/common/v1/location.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Weather.V1";

// Serves current conditions and forecasts.
service WeatherService {
  // Returns the latest observation for a location.
  rpc GetCurrentConditions(GetCurrentConditionsRequest) returns (GetCurrentConditionsResponse);
  // Returns an hourly forecast.
  rpc GetForecast(GetForecastRequest) returns (GetForecastResponse);
}

message GetCurrentConditionsRequest {
  acme.common.v1.Location location = 1;
}

message GetCurrentConditionsResponse {
  Observation observation = 1;
}

message GetForecastRequest {
  acme.common.v1.Location location = 1;
  // Number of hours to forecast, 1 to 240.
  int32 hours = 2;
}

message GetForecastResponse {
  repeated Observation hourly = 1;
}

// One weather observation or forecast step.
message Observation {
  google.protobuf.Timestamp time = 1;
  double temperature_celsius = 2;
  Condition condition = 3;
  // Lint: STANDARD wants lower_snake_case field names, so this line is flagged (FIELD_LOWER_SNAKE_CASE).
  double windSpeedKph = 4;
}

enum Condition {
  CONDITION_UNSPECIFIED = 0;
  CONDITION_CLEAR = 1;
  CONDITION_CLOUDY = 2;
  CONDITION_RAIN = 3;
  CONDITION_SNOW = 4;
}
